name: "Todo Tree Action"
description: "Scans PRs for TODO comments and posts them as a comment"
author: "Alexandre Trotel"

branding:
  icon: "check-square"
  color: "blue"

inputs:
  github-token:
    description: "GitHub token for posting comments"
    required: true
    default: ${{ github.token }}
  path:
    description: "Path to scan"
    required: false
    default: "."
  tags:
    description: "Comma-separated tags to search for (e.g., TODO,FIXME,BUG,HACK)"
    required: false
    default: "TODO,WIP,MAYBE,FIXME,BUG,ERROR,HACK,WARN,WARNING,FIX,NOTE,XXX,INFO,DOCS,PERF,TEST,IDEA"
  include-patterns:
    description: "Comma-separated file patterns to include (e.g., *.rs,*.ts)"
    required: false
    default: ""
  exclude-patterns:
    description: "Comma-separated file patterns to exclude (e.g., *.min.js,vendor/**)"
    required: false
    default: ""
  changed-only:
    description: "Only scan files changed in this PR"
    required: false
    default: "false"
  new-only:
    description: "Only show new TODOs (not present in base branch)"
    required: false
    default: "false"
  fail-on-todos:
    description: "Fail the action if any TODOs are found"
    required: false
    default: "false"
  fail-on-fixme:
    description: "Fail the action if FIXME or BUG comments are found"
    required: false
    default: "false"
  max-todos:
    description: "Maximum number of TODOs allowed before failing (empty = unlimited)"
    required: false
    default: ""
  show-annotations:
    description: "Show TODOs as GitHub annotations on the files"
    required: false
    default: "true"
  max-annotations:
    description: "Maximum number of annotations to show (GitHub limit is 50)"
    required: false
    default: "50"
  post-comment:
    description: "Post a summary comment on the PR"
    required: false
    default: "true"
  update-comment:
    description: "Update existing summary comment instead of posting new one each run"
    required: false
    default: "true"

outputs:
  total:
    value: ${{ steps.scan.outputs.total }}
    description: "Total number of TODOs found"
  files_count:
    value: ${{ steps.scan.outputs.files_count }}
    description: "Number of files containing TODOs"
  has_todos:
    value: ${{ steps.scan.outputs.has_todos }}
    description: "Whether any TODOs were found (true/false)"
  json:
    value: ${{ steps.scan.outputs.json }}
    description: "Full JSON output from todo-tree"

runs:
  using: "composite"
  steps:
    - name: Run Todo Tree
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_INCLUDE_PATTERNS: ${{ inputs.include-patterns }}
        INPUT_EXCLUDE_PATTERNS: ${{ inputs.exclude-patterns }}
        INPUT_CHANGED_ONLY: ${{ inputs.changed-only }}
        INPUT_NEW_ONLY: ${{ inputs.new-only }}
        INPUT_FAIL_ON_TODOS: ${{ inputs.fail-on-todos }}
        INPUT_FAIL_ON_FIXME: ${{ inputs.fail-on-fixme }}
        INPUT_MAX_TODOS: ${{ inputs.max-todos }}
        INPUT_SHOW_ANNOTATIONS: ${{ inputs.show-annotations }}
        INPUT_MAX_ANNOTATIONS: ${{ inputs.max-annotations }}
      run: ${{ github.action_path }}/entrypoint.sh

    - name: Post PR Comment
      if: ${{ inputs.post-comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          let todos;
          try {
            todos = JSON.parse(fs.readFileSync('todos.json', 'utf8'));
          } catch (e) {
            console.log('No todos.json found or invalid JSON');
            return;
          }

          const marker = '<!-- todo-tree-action -->';
          const header = '## Todo Tree Summary';
          const changedOnly = '${{ inputs.changed-only }}' === 'true';
          const newOnly = '${{ inputs.new-only }}' === 'true';
          const sha = context.payload.pull_request?.head?.sha || context.sha;

          const priorityOrder = ['Critical', 'High', 'Medium', 'Low'];
          const priorityEmoji = {
            Critical: '🔴',
            High: '🟠',
            Medium: '🟡',
            Low: '🟢',
          };

          let body = `${header}\n\n`;

          const total = todos.summary?.total_count || 0;
          const files = todos.files || [];

          if (files.length > 0 && total > 0) {
            const items = [];
            for (const file of files) {
              for (const item of (file.items || [])) {
                items.push({ ...item, path: file.path, priority: item.priority || 'Medium' });
              }
            }
            items.sort((a, b) => priorityOrder.indexOf(a.priority) - priorityOrder.indexOf(b.priority));

            const criticalCount = items.filter(i => i.priority === 'Critical').length;
            const scopeNote = newOnly
              ? ' (new in this PR)'
              : changedOnly
                ? ' (changed files only)'
                : '';

            body += `> [!WARNING]\n> Found **${total}** TODO(s) across **${files.length}** file(s)${scopeNote}`;
            body += criticalCount > 0 ? ` — **${criticalCount} Critical**\n\n` : '\n\n';

            body += '### Details\n\n';
            body += '| Priority | Tag | Location | Message |\n|---|---|---|---|\n';
            for (const item of items) {
              const emoji = priorityEmoji[item.priority] || '⚪';
              const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${sha}/${item.path}#L${item.line}`;
              body += `| ${emoji} ${item.priority} | \`${item.tag}\` | [\`${item.path}:${item.line}\`](${link}) | ${item.message} |\n`;
            }
            body += '\n';
          } else {
            body += 'No TODOs found!\n';
          }

          const readableDate = new Date().toLocaleString('en-US', {
            timeZone: 'UTC',
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
          }) + ' UTC';

          body += `\n<sub>Last updated ${readableDate} · [todo-tree](https://github.com/alexandretrotel/todo-tree)</sub>`;
          body += `\n${marker}`;

          const updateComment = '${{ inputs.update-comment }}' === 'true';

          if (updateComment) {
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.data.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
              console.log('Updated existing comment');
              return;
            }
          }

          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body
          });
          console.log('Created new comment');
